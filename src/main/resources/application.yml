spring:
  application:
    name: feed-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:placeholder}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service.default.svc.cluster.local:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.matreshka.*"
        spring.json.use.type.headers: false

  cloud:
    function:
      definition: consumeUser;mediaProcessorResult;consumeUpdatedUser;mediaDelete
    stream:
      default-binder: kafka
      bindings:
        consumeUpdatedUser-in-0:
          destination: user-updated-topic
          group: feed-service-user-updated-topic-group

        consumeUser-in-0:
          destination: user.created
          group: feed-service-user-created-topic-group-v2

        mediaProcessorResult-in-0:
          destination: media-processor-result
          group: feed-service-media-result-topic-group

        mediaDelete-in-0:
          destination: media.deleted
          group: feed-service-media-deleted-consumer-group

        mediaDelete-out-0:
          destination: media.deleted
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_STREAMS_BINDER_BROKERS:kafka-service.default.svc.cluster.local:9092}
        bindings:
          consumeUser-in-0:
            consumer:
              configuration:
                spring.json.value.default.type: "com.matreshka.feed_service.delivery.broker.dto.UserRegisteredEvent"
          consumeUpdatedUser-in-0:
            consumer:
              configuration:
                spring.json.value.default.type: "com.matreshka.feed_service.delivery.broker.dto.UserUpdatedEvent"
          mediaProcessorResult-in-0:
            consumer:
              configuration:
                value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
          mediaDelete-in-0:
            consumer:
              configuration:
                value.deserializer: org.apache.kafka.common.serialization.StringDeserializer


  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://elasticsearch.default.svc.cluster.local:9200}

server:
  port: 8007
  forward-headers-strategy: native

jwt:
  access:
    token:
      secret: ${JWT_ACCESS_TOKEN_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api-docs/feed/v3/api-docs
    url: /api-docs/feed/v3/api-docs

logging:
  level:
    org.springframework.web: DEBUG
    org.elasticsearch.client: DEBUG
    co.elastic.clients: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.cloud.stream: DEBUG
    org.springframework.messaging: DEBUG
    com.matreshka.feed_service.application.VideoService: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true


server:
  port: 8003
  forward-headers-strategy: framework

spring:
  application:
    name: chat-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:place-holder}
    username: ${SPRING_DATASOURCE_USERNAME:place-holder}
    password: ${SPRING_DATASOURCE_PASSWORD:place-holder}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:place-holder}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:place-holder}
      port: ${SPRING_DATA_REDIS_PORT:place-holder}
      password: ${SPRING_DATA_REDIS_PASSWORD:place-holder}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service.default.svc.cluster.local:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.matreshka.*"

  cloud:
    function:
      definition: consumeUser
    stream:
      default-binder: kafka
      bindings:
        consumeUser-in-0:
          destination: user.created
          group: chat-service-group
        chatMessages-out-0:
          destination: chat-messages-topic
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_STREAMS_BINDER_BROKERS:kafka-service.default.svc.cluster.local:9092}
        bindings:
          consumeUser-in-0:
            consumer:
              configuration:
                spring.json.value.default.type: "com.matreshka.chat_service.delivery.broker.dto.UserRegisteredEvent"


jwt:
  secrets:
    access: ${JWT_ACCESS_TOKEN_SECRET:place-holder}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.socket: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    Prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    otlp:
      tracing:
        endpoint: http://tempo-collector.default.svc.cluster.local:4317
  Prometheus:
    metrics:
      export:
        enabled: true
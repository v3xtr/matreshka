spring:
  application:
    name: media-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_db}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: "classpath:db/migration"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: "com.matreshka.media_service.delivery.broker.dto.UserRegisteredEvent"
        spring.json.trusted.packages: "com.matreshka.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    function:
      definition: consumeUser;consumeUserCreated;consumeMediaDelete
    stream:
      default-binder: kafka
      bindings:
        consumeUser-in-0:
          destination: user-updated-topic
          group: media-service-group

        consumeUserCreated-in-0:
          destination: user.created
          group: media-service-created-group

        videoSuccessBinding-out-0:
          destination: media-processor-result
          content-type: application/json
        videoProcessBinding-out-0:
          destination: media-processor-process

        consumeMediaDelete-in-0:
          destination: media.deleted
          group: media-service-group

        deleteMediaBinding-out-0:
          destination: media.deleted

        chatMediaBinding-out-0:
          destination: chat-media-topic

      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_STREAMS_BINDER_BROKERS:localhost:9092}
          auto-create-topics: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8002
  forward-headers-strategy: framework

aws:
  s3:
    region: ru-central-1
    access-key: ${AWS_S3_ACCESS_KEY:placeholder}
    secret-key: ${AWS_S3_SECRET_KEY:placeholder}
    endpoint: https://s3.ru1.storage.beget.cloud
    bucket:
      name: 9cdb3a15dcd8-divine-roux

jwt:
  access:
    token:
      secret: ${JWT_ACCESS_TOKEN_SECRET:placeholder}


springdoc:
  api-docs:
    path: /v3/api-docs
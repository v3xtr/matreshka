spring:
  application:
    name: media-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_db}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: "classpath:db/migration"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  # Базовая конфигурация клиента Kafka (Настроена по аналогии с profile-service)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Защита от ошибок десериализации, как в профилях
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: "com.matreshka.media_service.delivery.broker.dto.UserRegisteredEvent"
        spring.json.trusted.packages: "com.matreshka.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  # Настройка биндингов Spring Cloud Stream
  cloud:
    function:
      definition: consumeUser;consumeUserCreated;consumeMediaDelete
    stream:
      default-binder: kafka
      bindings:
        media-created-out-0:
          destination: media-created-topic

        consumeMedia-in-0:
          destination: media-thumbnail-results-topic
          group: media-service-group

        consumeUser-in-0:
          destination: user-updates-topic
          group: media-service-group

        consumeUserCreated-in-0:
          destination: user-notifications-topic
          group: media-service-created-group

        consumeMediaDelete-in-0:
          destination: media-delete-topic
          group: media-service-group

      # Привязка биндеров к брокеру Кафки
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_STREAMS_BINDER_BROKERS:localhost:9092}

  jackson:
    deserialization:
      fail-on-unknown-properties: false


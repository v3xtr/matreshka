spring.application.name=feed-service
server.port=8007

spring.threads.virtual.enabled=true

# --- Profiles / Proxy ---
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/feed_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# --- RabbitMQ connection ---
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# =========================================================
# Spring Cloud Stream — БИНДИНГИ ДЛЯ FEED-SERVICE
# =========================================================

# 1. Функция consumeUser (Обновления пользователей)
spring.cloud.stream.bindings.consumeUser-in-0.destination=user.updates
spring.cloud.stream.bindings.consumeUser-in-0.group=feed-service-group

# 2. Функция consumeUserCreated (Создание пользователей — Fanout)
spring.cloud.stream.bindings.consumeUserCreated-in-0.destination=user.created
spring.cloud.stream.bindings.consumeUserCreated-in-0.group=feed-service-group
spring.cloud.stream.rabbit.bindings.consumeUserCreated-in-0.consumer.exchange-type=fanout
spring.cloud.stream.bindings.consumeUserCreated-in-0.content-type=application/json

# 3. Функция consumeMediaCreated (Создание медиа — Topic)
# 3. Функция consumeMediaCreated (Прием сообщений)
spring.cloud.stream.bindings.consumeMediaCreated-in-0.destination=media.created
spring.cloud.stream.bindings.consumeMediaCreated-in-0.group=feed-service-group
spring.cloud.stream.rabbit.bindings.consumeMediaCreated-in-0.consumer.exchange-type=topic

# 4. Отправка события об удалении медиа наружу
spring.cloud.stream.bindings.mediaDelete-out-0.destination=media.deleted
spring.cloud.stream.rabbit.bindings.mediaDelete-out-0.producer.exchange-type=topic

# --- Активация функций (Перечисление строго через запятую) ---
spring.cloud.function.definition=consumeUser;consumeMediaCreated

# =========================================================
# Другие настройки инфраструктуры
# =========================================================
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://elasticsearch.default.svc.cluster.local:9200}
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

jwt.access.token.secret=${JWT_ACCESS_TOKEN_SECRET:bDrK+1TuYdVNN5jBKEDQgPXyf6A/74MqHMGkiEp5+i4=}

# --- Swagger / Springdoc (Интеграция с реверс-прокси шлюзом) ---
springdoc.api-docs.path=/v3/api-docs

# Перенаправляем внутренний UI на правильный префикс, чтобы относительные пути CSS/JS не ломались
springdoc.swagger-ui.path=/swagger-ui.html

# Самое важное: заставляем Сваггер запрашивать свои конфиги через прокси-путь Traefik
springdoc.swagger-ui.config-url=/api-docs/feed/v3/api-docs
springdoc.swagger-ui.url=/api-docs/feed/v3/api-docs
logging.level.org.springframework.web=DEBUG

# --- Метрики ---
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
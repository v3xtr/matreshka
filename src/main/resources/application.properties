# --- Redis ---
spring.data.redis.url=redis://:kdfdfjkdfjkR632u@85.198.69.217:6379

# --- FFmpeg Settings ---
# На твоем MacBook путь может быть /opt/homebrew/bin/ffmpeg, проверь командой 'which ffmpeg'
ffmpeg.path=/usr/bin/ffmpeg

# --- Spring Cloud Stream (RabbitMQ) ---
spring.cloud.function.definition=consumeMedia
spring.cloud.stream.bindings.consumeMedia-in-0.destination=media.created
spring.cloud.stream.bindings.consumeMedia-in-0.group=thumbnail-service-group
spring.cloud.stream.rabbit.bindings.consumeMedia-in-0.consumer.exchange-type=topic
spring.cloud.stream.rabbit.bindings.publishMedia-out-0.producer.exchange-type=topic

# Выходная очередь (отвечаем в TS)
# Был thumbnailResult-out-0, должен стать:
spring.cloud.stream.bindings.publishMedia-out-0.destination=media.thumbnail.results
# Настройки Rabbit (Взято из твоего RABBIT_URL)
# Внимание: если запускаешь локально, убедись, что адрес rabbitmq.default.svc... доступен (это внутренний адрес k8s)
# Если тестишь локально, поменяй на 85.198.69.217 или localhost
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin

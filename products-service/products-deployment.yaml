apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: proudsss/products-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:

            # ✅ Swagger + base path
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /

            - name: SPRINGDOC_API_DOCS_PATH
              value: "/v3/api-docs"

            # важно для работы за ingress
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "framework"

            # app config
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_JPA_OPEN_IN_VIEW
              value: "false"
            - name: SERVER_PORT
              value: "8005"

            # DB
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://85.198.69.217:5432/products_service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "kdfjfvhdkiojd83"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"

            # Redis
            - name: SPRING_DATA_REDIS_HOST
              value: "85.198.69.217"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: "kdfdfjkdfjkR632u"

            # RabbitMQ
            - name: RABBIT_HOST
              value: "rabbitmq.default.svc.cluster.local"
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER
              value: "admin"
            - name: RABBIT_PASSWORD
              value: "admin"

            # S3 / AWS
            - name: AWS_S3_ENDPOINT
              value: "https://s3.ru1.storage.beget.cloud"
            - name: AWS_S3_ACCESS_KEY
              value: "LM2JCURZW9HBM3IR6F8V"
            - name: AWS_S3_SECRET_KEY
              value: "x7cxbCcPWRV2rwjgnPyxmD566Qfe6cqbMZ69gj0F"
            - name: AWS_S3_BUCKET_NAME
              value: "9cdb3a15dcd8-divine-roux"
            - name: AWS_S3_REGION
              value: "ru-central-1"

            - name: "SPRING_ELASTICSEARCH_URIS"
              value: elasticsearch.default.svc.cluster.local
            - name: JWT_ACCESS_TOKEN_SECRET
              value: "bDrK+1TuYdVNN5jBKEDQgPXyf6A/74MqHMGkiEp5+i4="

---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  selector:
    app: products-service
  ports:
    - port: 8005
      targetPort: 8005
      protocol: TCP
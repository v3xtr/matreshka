spring:
  application:
    name: products-service

  jackson:
    default-property-inclusion: NON_NULL

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
    elasticsearch:
      repositories:
        enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.matreshka.*"

  cloud:
    function:
      definition: consumeUserCreated;mediaProcessorResult;consumeMediaDelete
    stream:
      default-binder: kafka
      bindings:
        consumeUserCreated-in-0:
          destination: user.created
          group: advert-service-group-v4
        mediaProcessorResult-in-0:
          destination: media-processor-result
          group: advert-service-group
          consumer:
            max-attempts: 5
            back-off-initial-interval: 3000
            back-off-max-interval: 30000
            back-off-multiplier: 2.0
        consumeMediaDelete-in-0:
          destination: media.deleted
          group: products-service-media-delete-group
      kafka:
        binder:
          brokers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
        bindings:
          consumeUserCreated-in-0:
            consumer:
              configuration:
                spring.json.value.default.type: "com.matreshka.products_service.delivery.broker.dto.UserRegisteredEvent"
          consumeMediaCreated-in-0:
            consumer:
              configuration:
                spring.json.value.default.type: "com.matreshka.products_service.delivery.broker.dto.MediaEvent"
          mediaProcessorResult-in-0:
            consumer:
              enableDlq: true
              dlqName: media-processor-result.DLQ
              dlqProducerProperties:
                configuration:
                  value.serializer: org.apache.kafka.common.serialization.StringSerializer
              configuration:
                value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
          mediaDelete-in-0:
            consumer:
              configuration:
                value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        consumer:
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.trusted.packages: "com.matreshka.*"

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}

server:
  port: 8005
  forward-headers-strategy: framework

jwt:
  secrets:
    access: ${JWT_ACCESS_TOKEN_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.data.elasticsearch: DEBUG
    co.elastic.clients.transport.rest_client: DEBUG
    org.springframework.data.elasticsearch.client.RestClient: DEBUG
    co.elastic.clients.rest: DEBUG
    co.elastic.clients.transport: DEBUG
    org.springframework.data.elasticsearch.core: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.cloud.stream: DEBUG
    com.matreshka.products_service.delivery.broker: DEBUG